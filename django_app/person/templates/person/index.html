<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Список людей</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">MyDjangoApp</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" href="/">Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/">Админка</a></li>
                <li class="nav-item"><a class="nav-link" href="/api/persons/">API</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4">Добавить человека</h2>
    <form id="person-form" class="mb-5">
        <div class="row g-3">
            <div class="col-md-4">
                <input type="text" class="form-control" id="name" placeholder="Имя" required>
            </div>
            <div class="col-md-4">
                <input type="email" class="form-control" id="email" placeholder="Email" required>
            </div>
            <div class="col-md-2">
                <input type="date" class="form-control" id="birth_date" placeholder="Дата рождения">
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">Добавить</button>
            </div>
        </div>
    </form>

    <h3>Список людей</h3>
    <table class="table table-striped" id="person-table">
        <thead>
            <tr>
                <th>#</th>
                <th>Имя</th>
                <th>Email</th>
                <th>Дата рождения</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="person-body"></tbody>
    </table>
</div>

<script>
// --- CSRF функция ---
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");
        for (let cookie of cookies) {
            cookie = cookie.trim();
            if (cookie.startsWith(name + "=")) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

const csrftoken = getCookie("csrftoken") || "";

// --- Получение списка людей ---
async function fetchPersons() {
    try {
        const res = await fetch("/api/persons/");
        const data = await res.json();
        const tbody = document.getElementById("person-body");
        tbody.innerHTML = "";

        data.forEach((person, index) => {
            tbody.innerHTML += `
                <tr data-id="${person.id}">
                    <td>${index + 1}</td>
                    <td class="name">${person.name}</td>
                    <td class="email">${person.email}</td>
                    <td class="birth_date">${person.birth_date || ""}</td>
                    <td>
                        <button class="btn btn-sm btn-warning edit">✏️</button>
                        <button class="btn btn-sm btn-danger delete">🗑</button>
                    </td>
                </tr>
            `;
        });

        document.querySelectorAll(".delete").forEach(btn => btn.addEventListener("click", deletePerson));
        document.querySelectorAll(".edit").forEach(btn => btn.addEventListener("click", editPerson));
    } catch (err) {
        console.error("Ошибка загрузки людей:", err);
    }
}

// --- Добавление человека ---
async function addPerson(name, email, birth_date) {
    try {
        const res = await fetch("/api/persons/", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRFToken": csrftoken },
            body: JSON.stringify({ name, email, birth_date })
        });
        if (res.ok) fetchPersons();
        else {
            const text = await res.text();
            console.error("Ошибка при добавлении:", text);
            alert("Ошибка при добавлении!");
        }
    } catch (err) {
        console.error("Ошибка сети при добавлении:", err);
        alert("Ошибка сети при добавлении!");
    }
}

// --- Удаление человека ---
async function deletePerson(event) {
    const row = event.target.closest("tr");
    const id = row.getAttribute("data-id");
    if (!confirm("Удалить этого человека?")) return;

    try {
        const res = await fetch(`/api/persons/${id}/`, {
            method: "DELETE",
            headers: { "X-CSRFToken": csrftoken }
        });
        if (res.ok) row.remove();
        else alert("Ошибка удаления!");
    } catch (err) {
        console.error("Ошибка сети при удалении:", err);
        alert("Ошибка сети при удалении!");
    }
}

// --- Редактирование человека ---
async function editPerson(event) {
    const row = event.target.closest("tr");
    const id = row.getAttribute("data-id");

    const name = prompt("Имя:", row.querySelector(".name").textContent);
    const email = prompt("Email:", row.querySelector(".email").textContent);
    const birth_date = prompt("Дата рождения:", row.querySelector(".birth_date").textContent);

    try {
        const res = await fetch(`/api/persons/${id}/`, {
            method: "PUT",
            headers: { "Content-Type": "application/json", "X-CSRFToken": csrftoken },
            body: JSON.stringify({ name, email, birth_date })
        });
        if (res.ok) fetchPersons();
        else alert("Ошибка при редактировании!");
    } catch (err) {
        console.error("Ошибка сети при редактировании:", err);
        alert("Ошибка сети при редактировании!");
    }
}

// --- Инициализация страницы ---
document.addEventListener("DOMContentLoaded", () => {
    fetchPersons();

    const form = document.getElementById("person-form");
    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const birth_date = document.getElementById("birth_date").value;

        await addPerson(name, email, birth_date);
        form.reset();
    });
});
</script>

</body>
</html>
